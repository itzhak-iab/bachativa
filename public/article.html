  .article-meta-bar {
    display: flex;
    align-items: center;

    margin-bottom: 1.8rem;

  }
  .article-author {
    display: flex;
    align-items: center;

  }
  .article-author img {
    width: 48px; height: 48px;
    border-radius: 50%;
    object-fit: cover;

  }
  .article-author-text strong {
    display: block;
    color: var(--olive-darkest);
    font-size: 0.98rem;
  }
  .article-author-text span {
    display: block;
    font-size: 0.82rem;
    color: var(--text-light);
  }
  .article-date {
    color: var(--text-light);
    font-size: 0.88rem;
    margin-right: auto;
  }

  .article-hero-image {
    width: 100%;
    margin-bottom: 1.5rem;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .article-hero-image img { width: 100%; height: auto; display: block; }
  .article-hero-image .caption {
    background: var(--cream);
    padding: 0.6rem 1rem;
    font-size: 0.85rem;
    color: var(--text-muted);
    font-style: italic;
    border-top: 1px solid var(--border);
  }

  .article-body {
    font-size: 1.08rem;
    line-height: 1.85;
    color: var(--text);
  }
  .article-body p { margin-bottom: 1.2rem; }
  .article-body p:first-of-type::first-letter {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 3.5rem;
    font-weight: 900;
    color: var(--olive);
    float: right;
    line-height: 0.9;
    margin-left: 0.4rem;
    margin-top: 0.2rem;
  }
  .article-body h2, .article-body h3 {
    font-family: 'Frank Ruhl Libre', serif;
    color: var(--olive-darkest);
    margin: 1.8rem 0 0.7rem;
  }
  .article-body h2 { font-size: 1.6rem; }
  .article-body h3 { font-size: 1.3rem; }
  .article-body blockquote {
    border-right: 4px solid var(--gold);
    padding: 0.5rem 1.2rem;
    margin: 1.5rem 0;
    background: var(--cream-soft);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 1.18rem;
    color: var(--olive-dark);
    font-style: italic;
  }
  .article-body img { margin: 1.5rem auto; border-radius: var(--radius-sm); box-shadow: var(--shadow); }
  .article-body ul, .article-body ol { margin-bottom: 1.2rem; padding-right: 1.5rem; }
  .article-body li { margin-bottom: 0.4rem; }

  .article-gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 0.8rem;
    margin: 1.8rem 0;
  }
  .article-gallery img { border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition); aspect-ratio: 4/3; object-fit: cover; width: 100%; }
  .article-gallery img:hover { transform: scale(1.02); box-shadow: var(--shadow); }

  .article-footer {
    margin-top: 2.5rem;
    padding-top: 1.5rem;
    border-top: 2px solid var(--gold);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .not-found {
    text-align: center;
    padding: 4rem 1rem;
  }
  .not-found h2 { color: var(--olive-darkest); margin-bottom: 1rem; }

  /* Lightbox */
  .lightbox {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    padding: 2rem;
    cursor: zoom-out;
  }
  .lightbox.active { display: flex; }
  .lightbox img { max-width: 95vw; max-height: 90vh; }
</style>

<div id="articleContent">

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
<script src="/firebase-config.js"></script>
<script>
  firebase.initializeApp(window.FIREBASE_CONFIG);
  const db = firebase.firestore();

  const TYPE_LABELS = {
    'article': 'כתבה',
    'interview': 'ראיון',
    'torah': 'דבר תורה',
    'photo-of-week': 'תמונת השבוע',
    'gallery': 'גלריה'
  };

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  // Allow controlled HTML from rich-text editor (we trust admin input)
  function sanitizeHTML(html) {
    // basic strip of script/event handlers
    return String(html || '').replace(/<script[\s\S]*?<\/script>/gi, '')
      .replace(/\son\w+="[^"]*"/gi, '').replace(/javascript:/gi, '');
  }

  function getIdFromPath() {
    // /article/<id> OR ?id=<id>
    const path = location.pathname.replace(/\/$/, '');
    const m = path.match(/\/article\/([^/]+)$/);
    if (m) return decodeURIComponent(m[1]);
    return new URLSearchParams(location.search).get('id');
  }

  async function loadArticle() {
    const id = getIdFromPath();
    const container = document.getElementById('articleContent');
    if (!id) {
      container.innerHTML = '<div class="not-found"><h2>לא צוין מזהה כתבה</h2><p><a href="/">חזרה לבית</a></p></div>';
      return;
    }
    let article = null;
    try {
      const doc = await db.collection('articles').doc(id).get();
      if (!doc.exists) {
        container.innerHTML = '<div class="not-found"><h2>הכתבה לא נמצאה</h2><p><a href="/">חזרה לבית</a></p></div>';
        return;
      }
      article = { id: doc.id, ...doc.data() };
    } catch (err) {
      container.innerHTML = '<div class="not-found"><h2>שגיאה בטעינה</h2><p>' + esc(err.message) + '</p></div>';
      return;
    }

    let issue = null;
    if (article.issueId) {
      try {
        const isnap = await db.collection('issues').doc(article.issueId).get();
        if (isnap.exists) issue = { id: isnap.id, ...isnap.data() };
      } catch (e) { console.warn('issue fetch failed', e); }
    }

    // Update meta tags
    document.getElementById('pageTitle').textContent = article.title + ' | בחטיבה';
    document.getElementById('pageDesc').setAttribute('content', article.subtitle || '');
    document.getElementById('ogTitle').setAttribute('content', article.title);
    document.getElementById('ogDesc').setAttribute('content', article.subtitle || '');
    if (article.mainImageUrl) document.getElementById('ogImage').setAttribute('content', article.mainImageUrl);

    // GA
    if (typeof gtag === 'function') gtag('event', 'view_article', { article_id: id, title: article.title });

    renderArticle(article, issue);
  }

  function renderArticle(a, issue) {
    const issueLink = issue
      ? `<a href="/issue/${esc(issue.id)}">גיליון ${esc(issue.issueNumber)} — פרשת ${esc(issue.parsha || '')}</a>`
      : '';
    const eyebrowText = (TYPE_LABELS[a.type] || 'כתבה') + (issueLink ? ' · ' : '');
    const heroImg = a.mainImageUrl ? `
      <div class="article-hero-image">
        <img src="${esc(a.mainImageUrl)}" alt="${esc(a.title)}">
        ${a.mainImageCaption ? `<div class="caption">${esc(a.mainImageCaption)}</div>` : ''}
      </div>` : '';
    const author = a.authorName ? `
      <div class="article-author">
        ${a.authorPhotoUrl ? `<img src="${esc(a.authorPhotoUrl)}" alt="${esc(a.authorName)}">` : ''}
        <div class="article-author-text">
          <strong>${esc(a.authorName)}</strong>
          ${a.authorRole ? `<span>${esc(a.authorRole)}</span>` : ''}
        </div>
      </div>` : '';
    const subtitle = a.subtitle ? `<p class="article-subtitle">${esc(a.subtitle)}</p>` : '';
    const dateStr = a.publishedAt && a.publishedAt.toDate ? a.publishedAt.toDate().toLocaleDateString('he-IL', { day:'numeric', month:'long', year:'numeric' }) : '';
    const gallery = (a.gallery && a.gallery.length) ? `
      <div class="article-gallery">
        ${a.gallery.map(g => `<img src="${esc(g.url || g)}" alt="${esc(g.caption || '')}" onclick="openLightbox(this.src)">`).join('')}
      </div>` : '';

    document.getElementById('articleContent').innerHTML = `
      <article class="article-page">
        <div class="article-eyebrow">${eyebrowText}${issueLink}</div>
        <h1>${esc(a.title)}</h1>
        ${subtitle}
        <div class="article-meta-bar">
          ${author}
          ${dateStr ? `<span class="article-date">${esc(dateStr)}</span>` : ''}
        </div>
        ${heroImg}
        <div class="article-body">${sanitizeHTML(a.body || '')}</div>
        ${gallery}
        <div class="article-footer">
          <a href="/" class="btn btn-outline">← לכל הכתבות</a>
          ${issue && issue.pdfHeUrl ? `<a href="/${esc(issue.pdfHeUrl.replace(/^\//,''))}" target="_blank" class="btn btn-gold">⬇ הורד את הגיליון בPDF</a>` : ''}
        </div>
      </article>`;
  }

  function openLightbox(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightbox').classList.add('active');
  }

  loadArticle();
</script>
</body>
</html>
